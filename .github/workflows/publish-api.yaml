name: Publish API Contract Pipeline

on: 
  workflow_dispatch:
  workflow_call:

jobs:
  publish-api:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Passo 0: Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Passo 1: Gerar Swagger
      # -------------------------
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Swagger (OpenAPI)
        run: yarn generate:api