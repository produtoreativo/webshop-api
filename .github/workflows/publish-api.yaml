name: Publish API Contract Pipeline

on: 
  workflow_dispatch:
    inputs:
      apicurio_url:
        description: "URL do Apicurio Registry"
        required: true
        default: "http://localhost:8085"
      api_version:
        description: "Versão da API"
        required: true
        default: "1.0.0"

  workflow_call:
    inputs:
      apicurio_url:
        type: string
        required: true
      api_version:
        type: string
        required: true

jobs:
  publish-api:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Passo 0: Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Passo 1: Gerar Swagger
      # -------------------------
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Swagger (OpenAPI)
        run: yarn generate:api

      # -------------------------
      # Passo 2: Publicar no Apicurio Registry
      # -------------------------
      - name: Publish to Apicurio Registry
        run: |
          curl -X POST \
            "${{ inputs.apicurio_url }}/apis/registry/v2/groups/webshop/artifacts" \
            -H "Content-Type: application/yaml" \
            -H "X-Registry-ArtifactId: webshop-api-${{ inputs.api_version }}" \
            --data-binary @./docs/swagger.yaml