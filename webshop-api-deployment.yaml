apiVersion: apps/v1
kind: Deployment
metadata:
  name: webshop-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webshop-api
  template:
    metadata:
      labels:
        app: webshop-api
    spec:
      containers:
        - name: webshop-api
          image: webshop-api:1.1.3
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: webshop-api-config
            - secretRef:
                name: webshop-api-secrets
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"